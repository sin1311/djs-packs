# stdio 24장 V3-2b-2 SigLIP 준비 (사람/클로드가 시작): 상황 어휘 글 임베딩 · 점수 눈금 · 시험 기준값 · 사진 쪽 int8 → models 가지에 더해요(다른 모델 파일은 그대로)
name: siglip-prep
on:
  workflow_dispatch:
    inputs:
      publish: { description: 'models 가지에 더할지 (false = 확인만)', default: 'true' }
permissions:
  contents: write
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 도구
        run: |
          npm init -y > /dev/null
          npm pkg set type=module
          ONNXRUNTIME_NODE_INSTALL_CUDA=skip npm i @huggingface/transformers@3.1.2
      - name: 준비
        run: node scripts/siglip-prep.mjs
      - name: models 가지에 더하기
        if: ${{ github.event.inputs.publish != 'false' }}
        run: |
          git config --global user.name 'github-actions[bot]'; git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git clone -q --depth 1 -b models "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mb
          cp models/siglip-* mb/ && cd mb && git add -A && git commit -q -m "SigLIP 준비물 (상황 어휘 글 임베딩 · 눈금 · 사진 쪽 int8)" && for k in 1 2 3 4; do git push origin models && break; sleep $((k * 15)); git pull -q --rebase origin models; done
