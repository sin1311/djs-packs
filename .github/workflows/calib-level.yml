# 수평 맞추기 보정 (사람이 시작): Poly Haven HDRI(수평 정답 0°)를 아는 각도로 기울여 재고, 믿음 규칙을 고르는 표를 만들어요.
#  결과: 로그의 "후보" 줄 + 아티팩트 calib-level (calib-level.json). 장면을 만들거나 올리지 않아요.
name: calib-level
on:
  workflow_dispatch:
    inputs:
      n: { description: '사진 수', default: '150' }
      depth: { description: '깊이(지면 평면) 방식도 재기', type: boolean, default: true }
      tilts: { description: '기울기(도, 쉼표) — 0 은 반듯한 사진 그대로', default: '0,3,8' }
permissions:
  contents: read
jobs:
  calib:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 도구
        run: |
          npm init -y > /dev/null
          ONNXRUNTIME_NODE_INSTALL_CUDA=skip npm i sharp@0.33.5 onnxruntime-node@1.20.1
          mkdir -p models && curl -fL -o models/dav2s.onnx https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/main/onnx/model.onnx
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: PanDA-Small → ONNX (세 번째 방식)
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/caozidong/PanDA PanDA
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q einops pyyaml opencv-python-headless onnx onnxscript safetensors matplotlib pillow
          curl -fL -o models/panda_small.pth "https://huggingface.co/ZidongC/PanDA/resolve/main/panda_small.pth?download=true"
          python scripts/export-panda.py "$(pwd)/models/panda_small.pth"
      - name: 보정
        run: |
          D=""; [ "${{ github.event.inputs.depth }}" != "false" ] && D="--depth models/dav2s.onnx"; [ -f models/panda_small.onnx ] && D="$D --panda models/panda_small.onnx"
          node scripts/scene-mass.mjs --stage calib-level --n "${{ github.event.inputs.n }}" --tilts "${{ github.event.inputs.tilts }}" $D
      - uses: actions/upload-artifact@v4
        with: { name: calib-level, path: work/calib-level.json }
