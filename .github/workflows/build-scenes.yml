# 장면 공장: Actions 탭 → build-scenes → Run workflow (사람이 시작해요, 자동으로 돌지 않아요)
#  scripts/scene-factory.mjs 가 Poly Haven(CC0) HDRI 를 받아 → 라이선스 검사 → 얼굴(YuNet) · 번호판(후보) 흐림 →
#  큐브맵 6면 깊이(Depth Anything V2 Small, ONNX · CPU) → 면 사이 (s, t) 정렬 → 지면 캘리브레이션 → 2~3층 LDI → 팩으로 만들어
#  scenes 가지에 올려요. 앱은 jsDelivr(cdn.jsdelivr.net/gh/sin1311/djs-packs@scenes/) 와 GitHub raw 로 받아요.
#  사람 확인: report.json 의 privacy.review 가 true 인 장면은 앱이 "확인 전" 으로 표시하고 기본 선택에서 빼요.
name: build-scenes
on:
  workflow_dispatch:
    inputs:
      count:
        description: '주제마다 몇 개 (주제 10개 × 이 수 = 최대 장면 수). 5 → 최대 50곳'
        default: '5'
      themes:
        description: '주제 (비우면 10개 모두): city nightcity daycity market club field forest coast industrial cozy'
        default: ''
      ids:
        description: '(선택) 직접 고르기: "아이디:주제" 띄어쓰기로. 비우면 자동 고르기. 없는 아이디는 건너뛰어요'
        default: ''
      size:
        description: '등장방형 가로 화소 (2048 권장 · 1536 이면 용량 약 절반)'
        default: '2048'
permissions:
  contents: write
concurrency:
  group: build-scenes
  cancel-in-progress: false
jobs:
  scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 도구 (sharp · onnxruntime-node CPU)
        run: |
          npm init -y > /dev/null
          ONNXRUNTIME_NODE_INSTALL_CUDA=skip npm i sharp@0.33.5 onnxruntime-node@1.20.1
          node -e "require('sharp'); require('onnxruntime-node'); console.log('도구 확인: sharp · onnxruntime-node OK')"
      - name: 모델 받기 (Depth Anything V2 Small = Apache-2.0 · YuNet = MIT)
        run: |
          mkdir -p models
          curl -fL -o models/dav2s.onnx https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/main/onnx/model.onnx
          curl -fL -o models/yunet.onnx https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
          curl -fL -o models/sface.onnx https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx  # 1단계 모자이크 최소 충분 흐림 (SFace · Apache-2.0)
          ls -la models
      - name: 장면 만들기 · 가지에 나눠 올리기 (scenes = 목록, scenes-1 · scenes-2 … = 장면, 가지마다 40MB 이하)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          IDS="${{ github.event.inputs.ids }}"; THEMES="${{ github.event.inputs.themes }}"
          node scripts/scene-factory.mjs --source polyhaven --count "${{ github.event.inputs.count }}" ${THEMES:+--themes "$THEMES"} ${IDS:+--ids "$IDS"} --size "${{ github.event.inputs.size }}" --shard 40 --depth models/dav2s.onnx --face models/yunet.onnx --sface models/sface.onnx --out out
          cat out/scenes/report.json | head -c 20000
          du -sh out/*
          REPO="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          ls -d out/scenes-* > /dev/null 2>&1 || { echo "만든 장면이 없어요 — 위 로그의 실패 이유를 보세요"; exit 1; }
          for d in out/scenes-*; do b=$(basename "$d"); cp README.md "$d/README.md"; (cd "$d" && git init -q -b "$b" && git add -A && git commit -q -m "장면 팩 $b" && for k in 1 2 3 4; do git push -f "$REPO" "$b" && break; echo "올리기 다시 ($k)"; sleep $((k * 15)); done); done
          cp README.md out/scenes/README.md
          (cd out/scenes && git init -q -b scenes && git add -A && git commit -q -m "장면 목록" && for k in 1 2 3 4; do git push -f "$REPO" scenes && break; echo "목록 올리기 다시 ($k)"; sleep $((k * 15)); done)
