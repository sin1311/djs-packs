# stdio 24장 V8-2e 받아쓰기 실측 — 배경음악 위 말 · 겹친 말 · 음원 분리 먼저 (사람/클로드가 시작) → whisper-noise.json(숫자만)
name: whisper-noise
on:
  workflow_dispatch:
    inputs:
      publish: { description: 'models 가지에 더할지 (false = 확인만)', default: 'true' }
      n: { description: '언어마다 문장 수', default: '20' }
permissions:
  contents: write
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 도구
        run: |
          pip install -q torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "numpy<2" demucs==4.0.1 onnxruntime==1.17.3 transformers==4.44.2 huggingface_hub==0.24.6 soundfile scipy
      - name: 준비
        env: { N: '${{ github.event.inputs.n }}' }
        run: python scripts/whisper-noise.py
      - name: 확인용 올리기
        uses: actions/upload-artifact@v4
        with: { name: whisper, path: models/whisper-noise.json }
      - name: models 가지에 더하기
        if: ${{ github.event.inputs.publish != 'false' }}
        run: |
          git config --global user.name 'github-actions[bot]'; git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git clone -q --depth 1 -b models "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mb
          cp models/whisper-noise.json mb/ && cd mb && git add -A && git commit -q -m "Whisper 받아쓰기 실측 2 (배경음악 · 겹친 말 · 음원 분리)" && for k in 1 2 3 4; do git push origin models && break; sleep $((k * 15)); git pull -q --rebase origin models; done
