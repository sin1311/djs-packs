# 음원 팩 공장: Actions 탭 → build-packs → Run workflow (사람이 시작해요, 자동으로 돌지 않아요)
#  scripts/build-packs.mjs 가 CC 샘플(VSCO 2 CE = CC0, Salamander = CC BY 3.0)과 직접 합성한 소리(기타 · 공간 응답)로 팩을 만들어
#  등급마다 같은 이름의 가지(lite · standard · full)에 올려요. 앱은 jsDelivr(cdn.jsdelivr.net/gh/sin1311/djs-packs@<등급>/) 와
#  GitHub raw 로 받아요. 가지를 나눈 이유: jsDelivr 는 ref(가지) 하나 50MB · 파일 하나 20MB 까지만 내보내요.
name: build-packs
on:
  workflow_dispatch:
    inputs:
      tiers:
        description: '만들 등급 (띄어쓰기로)'
        default: 'lite standard full'
permissions:
  contents: write
concurrency:
  group: build-packs
  cancel-in-progress: false
jobs:
  packs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: 팩 만들기 · 등급별 가지에 올리기
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          for t in ${{ github.event.inputs.tiers }}; do
            node scripts/build-packs.mjs --tier "$t" --out "out/$t"
            du -sh "out/$t"
            cp README.md "out/$t/README.md"
            (cd "out/$t" && git init -q -b "$t" && git add -A && git commit -q -m "음원 팩 $t" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$t")
          done
