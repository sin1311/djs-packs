# 비밀값 확인 (사람이 시작): HF_TOKEN · MAPILLARY_TOKEN 이 들어 있고 쓸 수 있는지만 봐요. 토큰 값은 로그에 찍지 않아요.
name: check-secrets
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Hugging Face 토큰
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "HF_TOKEN: 없음"; exit 0; fi
          echo "HF_TOKEN: 있음 (길이 ${#HF_TOKEN})"
          curl -s -H "Authorization: Bearer $HF_TOKEN" https://huggingface.co/api/whoami-v2 > me.json
          python3 - <<'PY'
          import json
          d = json.load(open('me.json'))
          if 'error' in d: print('Hugging Face 응답 오류:', d.get('error')); raise SystemExit(0)
          a = (d.get('auth') or {}).get('accessToken') or {}
          print('사용자 이름:', d.get('name'))
          print('토큰 종류:', a.get('role'))
          fg = a.get('fineGrained') or {}
          for s in fg.get('scoped') or []:
              e = s.get('entity') or {}
              print('  권한 대상:', e.get('type'), e.get('name'), '→', ', '.join(s.get('permissions') or []))
          PY
          NAME=$(python3 -c "import json;print(json.load(open('me.json')).get('name',''))")
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $HF_TOKEN" "https://huggingface.co/api/datasets/$NAME/djs-scenes")
          echo "데이터셋 $NAME/djs-scenes: HTTP $code (200 = 있음)"
      - name: Mapillary 토큰
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
        run: |
          if [ -z "$MAPILLARY_TOKEN" ]; then echo "MAPILLARY_TOKEN: 없음 (선택)"; exit 0; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://graph.mapillary.com/images?access_token=$MAPILLARY_TOKEN&fields=id&bbox=2.33,48.85,2.36,48.87&limit=1")
          echo "MAPILLARY_TOKEN: 있음 · 시험 요청 HTTP $code (200 = 쓸 수 있음)"
