# stdio 24장 V3-2b-2 상황 요인 어휘 굽기(V3-2c · 사람/클로드가 시작): data/fac-prompts.json → SigLIP 글 임베딩 → models 가지에 더해요
name: siglip-fac
on:
  workflow_dispatch:
    inputs:
      publish: { description: 'models 가지에 더할지 (false = 확인만)', default: 'true' }
permissions:
  contents: write
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 도구
        run: |
          npm init -y > /dev/null
          npm pkg set type=module
          ONNXRUNTIME_NODE_INSTALL_CUDA=skip npm i @huggingface/transformers@3.1.2
      - name: 준비
        run: node scripts/siglip-fac.mjs
      - name: models 가지에 더하기
        if: ${{ github.event.inputs.publish != 'false' }}
        run: |
          git config --global user.name 'github-actions[bot]'; git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git clone -q --depth 1 -b models "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mb
          cp models/siglip-fac* mb/ && cd mb && git add -A && git commit -q -m "SigLIP 상황 요인 어휘 글 임베딩" && for k in 1 2 3 4; do git push origin models && break; sleep $((k * 15)); git pull -q --rebase origin models; done
