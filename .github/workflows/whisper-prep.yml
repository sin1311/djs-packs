# stdio 24장 V8-2 Whisper tiny 준비 (사람/클로드가 시작): onnx-community/whisper-tiny(고정 판 · int8) → 인코더 · 디코더 ONNX · 어휘 · 생성 설정 ·
#  앱 전처리 · 풀기 확인용 기준값(PyTorch 원본 글 포함) → models 가지에 더해요(다른 모델 파일은 그대로)
name: whisper-prep
on:
  workflow_dispatch:
    inputs:
      publish: { description: 'models 가지에 더할지 (false = 확인만)', default: 'true' }
permissions:
  contents: write
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 도구
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q flite
          pip install -q torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "numpy<2" onnxruntime==1.17.3 transformers==4.44.2 huggingface_hub==0.24.6 soundfile scipy
      - name: 준비
        run: python scripts/whisper-prep.py
      - name: 확인용 올리기
        uses: actions/upload-artifact@v4
        with: { name: whisper, path: models/whisper-*.json }
      - name: models 가지에 더하기
        if: ${{ github.event.inputs.publish != 'false' }}
        run: |
          git config --global user.name 'github-actions[bot]'; git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git clone -q --depth 1 -b models "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mb
          cp models/whisper* mb/ && cd mb && git add -A && git commit -q -m "Whisper tiny 준비물 (인코더 · 디코더 int8 · 어휘 · 생성 설정 · 기준값)" && for k in 1 2 3 4; do git push origin models && break; sleep $((k * 15)); git pull -q --rebase origin models; done
